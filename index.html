<!DOCTYPE html>
<html>
<head>
<title>Sunny Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
margin:0;
background:#fff1b8;
font-family:'Comic Sans MS',cursive;
}

.card{
width:90%;
max-width:400px;
margin:25px auto;
background:white;
border-radius:35px;
padding:25px;
text-align:center;
box-shadow:0 10px 25px #bbb;
}


.dp{
width:100px;
height:100px;
border-radius:50%;
object-fit:cover;
border:5px solid #ffd000;
}


h1{
color:#ff6800;
font-family:monospace;
}


.amount{
background:#ffe066;
padding:12px;
border-radius:25px;
font-size:25px;
font-weight:bold;
}


#qrcode{
margin:20px auto;
}


button{
width:90%;
height:60px;
margin:10px;
border:none;
border-radius:30px;
font-size:18px;
color:white;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
gap:10px;
}


.pay{
background:#22c55e;
}


.paid{
background:#ff4d8d;
}


.gif{
width:35px;
height:35px;
object-fit:contain;
}


input{
display:none;
}


#preview{
width:250px;
margin-top:15px;
border-radius:15px;
}

</style>

</head>

<body>


<div class="card">


<img src="dp.png" class="dp">


<h1>𝙰𝚊𝙱𝚋𝙲𝚌𝙳𝚍𝙴𝚎𝙵𝚏𝙶𝚐 Pay</h1>


<div class="amount">
₹ <span id="amount"></span>
</div>


<div id="qrcode"></div>



<button class="pay" onclick="payNow()">

<img src="rocket.gif" class="gif">

Pay Now

</button>



<button class="paid" onclick="upload()">

<img src="tick.gif" class="gif">

Paid

</button>



<input 
type="file"
id="file"
accept="image/*">



<img id="preview">


</div>



<script>


const params=new URLSearchParams(location.search);


let upi=params.get("upiid");
let amount=params.get("amount");


if(!upi || !amount){

upi="8447633950@pthdfc";
amount="1";

}



document.getElementById("amount").innerHTML=amount;



let upiLink=
`upi://pay?pa=${encodeURIComponent(upi)}&pn=Sunny%20Pay&am=${amount}&cu=INR`;



// QR

new QRCode(
document.getElementById("qrcode"),
{
text:upiLink,
width:220,
height:220
});



// Pay Button

function payNow(){

window.location.href=upiLink;

}



// Paid Upload

function upload(){

document.getElementById("file").click();

}



document.getElementById("file").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){

document.getElementById("preview").src=e.target.result;

}

reader.readAsDataURL(this.files[0]);

}


</script>


</body>
</html>
