<!DOCTYPE html>
<html>
<head>
<title>UPI Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    font-family: Arial;
    text-align:center;
    padding:20px;
}

#qrcode{
    margin:20px auto;
    width:220px;
}

button{
    background:#1677ff;
    color:white;
    border:0;
    padding:12px 30px;
    border-radius:8px;
    font-size:16px;
}

input{
    display:none;
}

#preview{
    max-width:250px;
    margin-top:20px;
}
</style>

</head>

<body>

<h2>Scan & Pay</h2>

<h3 id="amount"></h3>

<div id="qrcode"></div>

<button onclick="payDone()">Paid</button>

<input type="file" id="upload" accept="image/*" capture="environment">

<br>

<img id="preview">

<script>

const params = new URLSearchParams(location.search);

let upi = params.get("upiid");
let amount = params.get("amount");

if(!upi || !amount){
    upi="8447633950@pthdfc";
    amount="1";
}

document.getElementById("amount").innerHTML="Pay ₹"+amount;


// UPI QR
let upiLink =
`upi://pay?pa=${upi}&pn=Payment&am=${amount}&cu=INR`;

new QRCode(document.getElementById("qrcode"),{
    text:upiLink,
    width:220,
    height:220
});


// Paid button

function payDone(){

    document.getElementById("upload").click();

}


document.getElementById("upload").onchange=function(){

    let file=this.files[0];

    if(file){

        let reader=new FileReader();

        reader.onload=function(e){
            document.getElementById("preview").src=e.target.result;
        }

        reader.readAsDataURL(file);

    }

}

</script>

</body>
</html>
