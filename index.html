<!DOCTYPE html>
<html>
<head>
<title>Sunny Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    margin:0;
    background:#fff0b3;
    font-family:'Comic Sans MS',cursive;
}

.box{
    width:90%;
    max-width:400px;
    margin:30px auto;
    background:white;
    border-radius:35px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px #bbb;
}


.dp{
    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #ffcc00;
}


h1{
    color:#ff6b00;
}


.money{
    background:#ffe066;
    padding:12px;
    border-radius:25px;
    font-size:25px;
    font-weight:bold;
}


#qrcode{
    margin:20px;
}


button{

    width:90%;
    padding:15px;
    margin:10px;

    border:0;
    border-radius:30px;

    font-size:18px;
    color:white;

}


.pay{
    background:#22c55e;
}


.paid{
    background:#ff4d8d;
}


input{
    display:none;
}


#preview{
    width:250px;
    border-radius:15px;
    margin-top:15px;
}


</style>

</head>


<body>


<div class="box">


<img src="logo.jpg" class="dp">


<h1>🤑 Sunny Pay 💰</h1>


<div class="money">
₹ <span id="amount"></span>
</div>


<div id="qrcode"></div>


<button class="pay" onclick="payNow()">
🚀 Pay Now
</button>


<button class="paid" onclick="upload()">
✅ Paid
</button>


<input 
type="file"
id="file"
accept="image/*"
capture="environment">


<img id="preview">


</div>



<script>


// URL DATA

const data = new URLSearchParams(window.location.search);


let upi = data.get("upiid");

let amount = data.get("amount");



if(!upi || !amount){

alert("Invalid Payment Link");

upi="8447633950@pthdfc";
amount="1";

}



document.getElementById("amount").innerHTML=amount;



// UPI LINK

let upiURL =
"upi://pay?pa="+encodeURIComponent(upi)+
"&pn=Sunny%20Pay"+
"&am="+amount+
"&cu=INR";



// QR CODE

new QRCode(
document.getElementById("qrcode"),
{
text:upiURL,
width:220,
height:220
}
);



// OPEN UPI APP

function payNow(){

window.location.href=upiURL;

}



// UPLOAD PAYMENT PROOF

function upload(){

document.getElementById("file").click();

}



document.getElementById("file").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){

document.getElementById("preview").src=e.target.result;

}


reader.readAsDataURL(this.files[0]);

}



</script>


</body>
</html>
