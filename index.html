<!DOCTYPE html>
<html>
<head>
<title>Cartoon UPI Pay</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>
body{
    margin:0;
    font-family:'Comic Sans MS',Arial;
    background:#fff3cd;
    text-align:center;
}

.card{
    margin:30px auto;
    width:85%;
    background:white;
    border-radius:30px;
    padding:25px;
    box-shadow:0 8px 20px #ccc;
}

.character{
    font-size:70px;
}

h1{
    color:#ff6b00;
}

.amount{
    background:#ffe066;
    padding:10px;
    border-radius:20px;
    font-size:22px;
}

#qrcode{
    margin:20px auto;
}

button{
    width:80%;
    padding:15px;
    margin:10px;
    border:none;
    border-radius:25px;
    font-size:18px;
    color:white;
    cursor:pointer;
}

.pay{
    background:#28a745;
}

.paid{
    background:#ff5c8a;
}

input{
    display:none;
}

img{
    max-width:250px;
    border-radius:15px;
}

</style>
</head>

<body>

<div class="card">

<div class="character">🤑💰</div>

<h1>Sunny Pay</h1>

<div class="amount">
Pay ₹<span id="amt"></span>
</div>


<div id="qrcode"></div>


<button class="pay" onclick="payNow()">
🚀 Pay Now
</button>


<button class="paid" onclick="uploadProof()">
✅ Paid
</button>


<input type="file" id="file" accept="image/*" capture="environment">

<img id="preview">

</div>


<script>

const params=new URLSearchParams(location.search);

let upi=params.get("upiid") || "8447633950@pthdfc";
let amount=params.get("amount") || "1";


document.getElementById("amt").innerHTML=amount;


let upiLink=
`upi://pay?pa=${upi}&pn=Sunny%20Pay&am=${amount}&cu=INR`;


// QR Generate

new QRCode(
document.getElementById("qrcode"),
{
text:upiLink,
width:220,
height:220
});


// Open UPI App

function payNow(){
    window.location.href=upiLink;
}


// Upload payment proof

function uploadProof(){
    document.getElementById("file").click();
}


document.getElementById("file").onchange=function(){

let reader=new FileReader();

reader.onload=function(e){
document.getElementById("preview").src=e.target.result;
}

reader.readAsDataURL(this.files[0]);

}

</script>

</body>
</html>
