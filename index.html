<!DOCTYPE html>
<html>
<head>

<title>Sunny Pay</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

body{
    margin:0;
    background:#fff2b8;
    font-family:'Comic Sans MS',cursive;
}

.card{

    width:90%;
    max-width:400px;
    margin:25px auto;
    background:white;
    border-radius:35px;
    padding:25px;
    text-align:center;
    box-shadow:0 10px 25px #bbb;

}


.logo{

    width:100px;
    height:100px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid #ffd000;

}


h1{

    color:#ff6800;
    font-family:monospace;

}


.user{

    font-size:18px;
    color:#555;

}


.amount{

    background:#ffe066;
    padding:12px;
    border-radius:25px;
    font-size:26px;
    font-weight:bold;

}


#qrcode{

    margin:20px auto;

}


button{

    width:90%;
    height:60px;
    margin:10px;

    border:none;
    border-radius:30px;

    color:white;
    font-size:18px;
    font-weight:bold;

    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;

}


.pay{

    background:#22c55e;

}


.paid{

    background:#ff4d8d;

}


.gif{

    width:35px;
    height:35px;
    object-fit:contain;

}


input{

    display:none;

}


#preview{

    width:250px;
    margin-top:15px;
    border-radius:15px;

}


</style>

</head>


<body>


<div class="card">


<img src="logo.jpg" class="logo">


<h1>𝙰𝚊𝙱𝚋𝙲𝚌𝙳𝚍𝙴𝚎𝙵𝚏𝙶𝚐 Pay</h1>


<div class="user">
sunny kumar
</div>


<br>


<div class="amount">

₹ <span id="amount"></span>

</div>



<div id="qrcode"></div>




<button class="pay" onclick="payNow()">

<img src="rocket.gif" class="gif">

Pay Now

</button>




<button class="paid" onclick="upload()">

<img src="tick.gif" class="gif">

Paid

</button>




<input 
type="file"
id="file"
accept="image/*">



<img id="preview">



</div>



<script>


// Fixed UPI Details

let upi="sunnypro@fam";

let name="sunny kumar";


// Get amount from URL

const params=new URLSearchParams(window.location.search);

let amount=params.get("amount");


if(!amount){

amount="1";

}



document.getElementById("amount").innerHTML=amount;



// Create UPI Link

let upiLink = 
`upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&am=${amount}&cu=INR`;



// Generate QR

new QRCode(

document.getElementById("qrcode"),

{

text:upiLink,

width:220,

height:220

}

);




// Open UPI App

function payNow(){

window.location.href=upiLink;

}



// Upload Payment Screenshot

function upload(){

document.getElementById("file").click();

}



document.getElementById("file").onchange=function(){


let reader=new FileReader();


reader.onload=function(e){

document.getElementById("preview").src=e.target.result;

}


reader.readAsDataURL(this.files[0]);


}



</script>


</body>

</html>
